name: CI Pipeline

# This tells GitHub to run this pipeline every time you push to the 'main' branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code from your repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set up Docker Buildx (an advanced Docker builder)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. Try to build the Docker image (this is your CI test)
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false # We just want to build it to make sure it works, not push it anywhere yet
        tags: fastapi-app:latest
